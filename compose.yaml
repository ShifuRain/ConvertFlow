# ConvertFlow stack. Works with docker compose and `podman compose`.
# Build args for the worker come from the shell:  set -a; . docker/ffmpeg.env; set +a
# Run scripts/gen-secrets.sh once before `up`. Run scripts/pin-digests.sh before every release.
name: convertflow

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  ulimits:
    core: {soft: 0, hard: 0}
    nofile: {soft: 4096, hard: 8192}

# Shared by api and worker so they can never diverge: the janitor in the API applies the job timeout,
# stale and retention windows that the worker enforces.
x-shared-env: &shared-env
  CONVERTFLOW_JOB_TIMEOUT: ${CONVERTFLOW_JOB_TIMEOUT:-4h}
  CONVERTFLOW_RETENTION: ${CONVERTFLOW_RETENTION:-24h}
  CONVERTFLOW_STALE_AFTER: ${CONVERTFLOW_STALE_AFTER:-60s}
  CONVERTFLOW_MAX_QUEUE_AGE: ${CONVERTFLOW_MAX_QUEUE_AGE:-24h}
  CONVERTFLOW_MAX_ATTEMPTS: ${CONVERTFLOW_MAX_ATTEMPTS:-3}
  # the API filters presets by flavor, so it must match the worker image flavor
  CONVERTFLOW_FLAVOR: ${FFMPEG_FLAVOR:-lgpl}

services:
  db:
    <<: *hardening
    image: docker.io/library/postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    user: "999:999"
    environment:
      POSTGRES_USER: convertflow
      POSTGRES_DB: convertflow
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    tmpfs: ["/tmp", "/run/postgresql:mode=1777"]
    networks: [backend]
    pids_limit: 200
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U convertflow -d convertflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *hardening
    image: convertflow-api:${CONVERTFLOW_VERSION:-dev}
    build: {context: ., dockerfile: Dockerfile.api}
    depends_on: {db: {condition: service_healthy}}
    environment:
      <<: *shared-env
      CONVERTFLOW_LISTEN: "0.0.0.0:8080"
      CONVERTFLOW_DATABASE_URL_FILE: /run/secrets/database_url
      CONVERTFLOW_MAX_UPLOAD_BYTES: ${CONVERTFLOW_MAX_UPLOAD_BYTES:-8589934592}
    secrets: [database_url]
    volumes: ["media:/data"]
    tmpfs: ["/tmp:size=64m"]
    ports: ["127.0.0.1:${CONVERTFLOW_PORT:-8080}:8080"]   # change the host IP deliberately to expose the service
    networks: [frontend, backend]
    stop_grace_period: 45s
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/convertflow-api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *hardening
    image: convertflow-worker:${CONVERTFLOW_VERSION:-dev}-${FFMPEG_FLAVOR:-lgpl}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        FFMPEG_FLAVOR: ${FFMPEG_FLAVOR:-lgpl}
        FFMPEG_VERSION: ${FFMPEG_VERSION:?set via docker/ffmpeg.env}
        FFMPEG_SHA256: ${FFMPEG_SHA256:?set via docker/ffmpeg.env}
    depends_on: {db: {condition: service_healthy}}
    environment:
      <<: *shared-env
      CONVERTFLOW_DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    volumes: ["media:/data"]
    tmpfs: ["/tmp:size=2g,mode=1777"]
    networks: [backend]            # no egress: backend is internal
    stop_grace_period: 45s
    pids_limit: 512
    mem_limit: 4g
    cpus: 4.0
    healthcheck:
      # liveness only (the worker exits on fatal errors and restart policy replaces it)
      test: ["CMD-SHELL", "grep -q convertflow-worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  frontend: {}
  backend: {internal: true}

volumes:
  pgdata: {}
  media: {}

secrets:
  db_password: {file: ./secrets/db_password}
  database_url: {file: ./secrets/database_url}
