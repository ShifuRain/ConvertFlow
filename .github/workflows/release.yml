# Release: runs ONLY for pushed tags v* (never for branch pushes).
#
# Two jobs with split privileges:
#   build-and-gate  contents: read (+ actions: read to query the CI result). Runs ALL third-party code (npm, Go tools,
#                   buildx, Trivy, Syft): CI-status gate, pinning/security gates, builds the LGPL images to local
#                   archives, scans them with Trivy, makes SBOMs, THIRD-PARTY-LICENSES, the air-gap bundle and
#                   checksums. Nothing is pushed or signed here, so a red scan leaves NOTHING in GHCR.
#   publish         environment: release (configure required reviewers), contents/packages/id-token: write. Runs no
#                   npm/go install steps: verifies the artifact checksums, pushes the already-scanned images,
#                   cosign-signs them (keyless) and the checksum/SBOM/bundle files, creates a DRAFT release.
# The checksum chain protects the hand-off from artifact-store tampering/TOCTOU only, NOT against a compromised
# build-and-gate job (it produces artifact, hash and verdict); the real controls are --ignore-scripts, the lockfile, a
# token-less build job and the approval on the `release` environment (which the owner must create with reviewers).
# The FULL (GPL) flavor is never released from here. NOTE: validated statically (actionlint, YAML parse); this
# workflow has not been executed on GitHub yet.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read    # read-only: query the CI workflow result for the tagged commit
    outputs:
      sums_sha256: ${{ steps.sums.outputs.sums_sha256 }}
    env:
      VERSION: ${{ github.ref_name }}
      FLAVOR: lgpl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be a semantic version on a commit reachable from main
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "tag '$VERSION' is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tagged commit is not on main"; exit 1; }
      - name: CI must have succeeded for this exact commit (fails closed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          scripts/check-ci-status.sh "$RUNNER_TEMP/ci-runs.json" "$GITHUB_SHA"
      - name: Lowercase image repository and FFmpeg pin
        id: meta
        run: |
          set -euo pipefail
          . docker/ffmpeg.env
          [[ "$FFMPEG_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          [[ "$FFMPEG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          { echo "ffmpeg_version=$FFMPEG_VERSION"; echo "ffmpeg_sha256=$FFMPEG_SHA256"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui   # npm ci --ignore-scripts
      # Release gates: unpinned references, stale or vanished base-image digests, vulnerable deps, gosec, licences.
      - name: Pinning, base-image digest freshness (strict) and security gates
        run: |
          scripts/check-pinned-digests.sh --online --strict
          scripts/check-trivyignore.sh
          scripts/security-scan.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create archive directories
        run: mkdir -p "$RUNNER_TEMP/rel/images" "$RUNNER_TEMP/rel/dist"
      - name: Build api (local archive only, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.api
          push: false
          provenance: false
          sbom: false
          tags: convertflow-api:${{ github.ref_name }}
          outputs: type=docker,dest=${{ runner.temp }}/rel/images/api.tar
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build worker lgpl (local archive only, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.worker
          push: false
          provenance: false
          sbom: false
          tags: convertflow-worker:${{ github.ref_name }}-lgpl
          build-args: |
            FFMPEG_FLAVOR=lgpl
            FFMPEG_VERSION=${{ steps.meta.outputs.ffmpeg_version }}
            FFMPEG_SHA256=${{ steps.meta.outputs.ffmpeg_sha256 }}
          outputs: type=docker,dest=${{ runner.temp }}/rel/images/worker.tar
          cache-from: type=gha,scope=worker-lgpl
          cache-to: type=gha,scope=worker-lgpl,mode=max
      - name: Trivy gate on the built archives (HIGH/CRITICAL with a fix fail; .trivyignore needs expiry+justification)
        env:
          CONTAINER_RUNTIME: docker
        run: scripts/trivy-scan.sh "$RUNNER_TEMP/rel/images/api.tar" "$RUNNER_TEMP/rel/images/worker.tar"
      - name: SBOMs (CycloneDX via syft - source/Go modules and each image archive)
        env:
          CONTAINER_RUNTIME: docker
        run: scripts/gen-sbom.sh "$RUNNER_TEMP/rel/dist/sbom" "$VERSION" "api=$RUNNER_TEMP/rel/images/api.tar" "worker=$RUNNER_TEMP/rel/images/worker.tar"
      - name: Load archives into podman (the runtime verified for the air-gap flow)
        run: |
          set -euo pipefail
          podman load -i "$RUNNER_TEMP/rel/images/api.tar"
          podman load -i "$RUNNER_TEMP/rel/images/worker.tar"
      - name: THIRD-PARTY-LICENSES
        env:
          CONTAINER_RUNTIME: podman
        run: |
          set -euo pipefail
          pg=$(grep -oE 'docker\.io/library/postgres:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' compose.yaml | head -n1)
          podman pull -q "$pg" >/dev/null
          scripts/gen-licenses.sh "$RUNNER_TEMP/rel/dist/THIRD-PARTY-LICENSES" "$FLAVOR" \
            "api=docker.io/library/convertflow-api:$VERSION" "worker=docker.io/library/convertflow-worker:$VERSION-$FLAVOR" "postgres=$pg"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" -C "$RUNNER_TEMP/rel/dist" -cf - THIRD-PARTY-LICENSES \
            | gzip -9n > "$RUNNER_TEMP/rel/dist/THIRD-PARTY-LICENSES.tar.gz"
      - name: Air-gap bundle
        env:
          CONTAINER_RUNTIME: podman
          API_IMAGE: docker.io/library/convertflow-api:${{ github.ref_name }}
          WORKER_IMAGE: docker.io/library/convertflow-worker:${{ github.ref_name }}-lgpl
        run: |
          set -euo pipefail
          LICENSES_DIR="$RUNNER_TEMP/rel/dist/THIRD-PARTY-LICENSES" SBOM_DIR="$RUNNER_TEMP/rel/dist/sbom" \
            scripts/make-airgap-bundle.sh "$VERSION" "$FLAVOR" "$RUNNER_TEMP/rel/dist"
          cp "$RUNNER_TEMP"/rel/dist/sbom/*.cdx.json "$RUNNER_TEMP/rel/dist/"
          rm -rf "$RUNNER_TEMP/rel/dist/sbom" "$RUNNER_TEMP/rel/dist/THIRD-PARTY-LICENSES"
      - name: Checksums of everything handed to the publish job
        id: sums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rel"
          find images dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.inputs
          # The hash of the checksum file travels as a job output, which the artifact store cannot tamper with.
          echo "sums_sha256=$(sha256sum SHA256SUMS.inputs | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.inputs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs
          path: |
            ${{ runner.temp }}/rel/images
            ${{ runner.temp }}/rel/dist
            ${{ runner.temp }}/rel/SHA256SUMS.inputs
          retention-days: 7   # long enough for the reviewer approval wait on the release environment
          if-no-files-found: error

  publish:
    needs: build-and-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Configure this environment in the repository settings with required reviewers (docs/supply-chain.md).
    environment: release
    permissions:
      contents: write   # create the draft release and upload assets
      packages: write   # push images to ghcr.io
      id-token: write   # cosign keyless signing (OIDC)
    env:
      VERSION: ${{ github.ref_name }}
      FLAVOR: lgpl
      SUMS_SHA256: ${{ needs.build-and-gate.outputs.sums_sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: ${{ runner.temp }}/rel
      - name: Verify artifact integrity before using anything
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rel"
          [[ "$SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "${SUMS_SHA256}  SHA256SUMS.inputs" | sha256sum -c -
          sha256sum -c SHA256SUMS.inputs
          # nothing may exist that the build job did not list
          test "$(find images dist -type f | wc -l)" = "$(wc -l < SHA256SUMS.inputs)"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Push the scanned images and sign them (cosign keyless, by digest)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="ghcr.io/${REPO,,}"
          : > "$RUNNER_TEMP/rel/dist/IMAGE-REFS.txt"
          for spec in "api:convertflow-api:$VERSION" "worker:convertflow-worker:$VERSION-$FLAVOR"; do
            file=${spec%%:*}; local_name=${spec#*:}
            docker load -i "$RUNNER_TEMP/rel/images/$file.tar"
            remote="$base/$local_name"
            docker tag "$local_name" "$remote"
            docker push "$remote"
            digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$remote" | grep -F "$base/" | head -n1 | sed 's/.*@//')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            cosign sign --yes "${remote%:*}@$digest"
            echo "${remote%:*}@$digest" >> "$RUNNER_TEMP/rel/dist/IMAGE-REFS.txt"
          done
          cat "$RUNNER_TEMP/rel/dist/IMAGE-REFS.txt"
      - name: Final checksums and signatures (cosign keyless sign-blob)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rel/dist"
          sha256sum -- * > SHA256SUMS
          for f in *; do
            case "$f" in SHA256SUMS|convertflow-*-airgap.tar.gz|*.cdx.json) cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" ;; esac
          done
          ls -l
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Verify

          Images and files are signed keyless with cosign (GitHub OIDC). Identity for this release:
          \`https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION}\`, issuer \`https://token.actions.githubusercontent.com\`.

              cosign verify <image-ref from IMAGE-REFS.txt> \\
                --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION}" \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com
              cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\
                --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION}" \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com
              sha256sum -c SHA256SUMS

          The air-gap bundle contains \`AIRGAP-README.txt\` with offline load instructions. Flavor: lgpl (FFmpeg LGPL build).
          NOTES
          pre=(); [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          gh release create "$VERSION" --repo "$REPO" --draft --verify-tag --title "ConvertFlow $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${pre[@]}" "$RUNNER_TEMP"/rel/dist/*
