# Release: runs ONLY for pushed tags v* (never for branch pushes). Builds the LGPL-flavor images, pushes them to GHCR,
# signs them keyless with cosign (GitHub OIDC), produces CycloneDX SBOMs, THIRD-PARTY-LICENSES, SHA256SUMS and the
# air-gap bundle, and creates a DRAFT GitHub release holding those files. A human publishes the draft.
# The FULL (GPL) flavor is never released from here: it is built only on manual CI runs for testing.
# NOTE: validated statically (actionlint, YAML parse); this workflow has not been executed on GitHub yet.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write   # create the draft release and upload assets
      packages: write   # push images to ghcr.io
      id-token: write   # cosign keyless signing (OIDC)
    env:
      VERSION: ${{ github.ref_name }}
      FLAVOR: lgpl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be a semantic version on a commit reachable from main
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "tag '$VERSION' is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tagged commit is not on main"; exit 1; }
      - name: Lowercase image repository and FFmpeg pin
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . docker/ffmpeg.env
          [[ "$FFMPEG_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          [[ "$FFMPEG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "image_base=ghcr.io/${REPO,,}"
            echo "ffmpeg_version=$FFMPEG_VERSION"
            echo "ffmpeg_sha256=$FFMPEG_SHA256"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui
      # Release gates: unpinned references, stale or vanished base-image digests, vulnerable deps, gosec, licences.
      - name: Pinning, base-image digest freshness (strict) and security gates
        run: |
          scripts/check-pinned-digests.sh --online --strict
          scripts/check-trivyignore.sh
          scripts/security-scan.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build and push api
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.api
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image_base }}/convertflow-api:${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push worker (lgpl)
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.worker
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image_base }}/convertflow-worker:${{ github.ref_name }}-lgpl
          build-args: |
            FFMPEG_FLAVOR=lgpl
            FFMPEG_VERSION=${{ steps.meta.outputs.ffmpeg_version }}
            FFMPEG_SHA256=${{ steps.meta.outputs.ffmpeg_sha256 }}
          cache-from: type=gha,scope=worker-lgpl
          cache-to: type=gha,scope=worker-lgpl,mode=max
      - name: Sign images (cosign keyless, by digest)
        env:
          BASE: ${{ steps.meta.outputs.image_base }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$BASE/convertflow-api@$API_DIGEST"
          cosign sign --yes "$BASE/convertflow-worker@$WORKER_DIGEST"
          printf '%s\n%s\n' "$BASE/convertflow-api@$API_DIGEST" "$BASE/convertflow-worker@$WORKER_DIGEST" > "$RUNNER_TEMP/image-refs.txt"
      - name: Pull the pushed images by digest and export archives
        env:
          BASE: ${{ steps.meta.outputs.image_base }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/img" dist
          docker pull "$BASE/convertflow-api@$API_DIGEST"
          docker pull "$BASE/convertflow-worker@$WORKER_DIGEST"
          # Names that compose.yaml expects.
          docker tag "$BASE/convertflow-api@$API_DIGEST" "convertflow-api:$VERSION"
          docker tag "$BASE/convertflow-worker@$WORKER_DIGEST" "convertflow-worker:$VERSION-$FLAVOR"
          docker save -o "$RUNNER_TEMP/img/api.tar" "convertflow-api:$VERSION"
          docker save -o "$RUNNER_TEMP/img/worker.tar" "convertflow-worker:$VERSION-$FLAVOR"
      - name: Trivy scan of the pushed images (same policy as CI)
        env:
          CONTAINER_RUNTIME: docker
        run: scripts/trivy-scan.sh "$RUNNER_TEMP/img/api.tar" "$RUNNER_TEMP/img/worker.tar"
      - name: SBOMs (CycloneDX via syft - source/Go modules and each image)
        env:
          CONTAINER_RUNTIME: docker
        run: scripts/gen-sbom.sh dist/sbom "$VERSION" "api=$RUNNER_TEMP/img/api.tar" "worker=$RUNNER_TEMP/img/worker.tar"
      - name: Load images into podman (the runtime verified for the air-gap flow)
        run: |
          set -euo pipefail
          podman load -i "$RUNNER_TEMP/img/api.tar"
          podman load -i "$RUNNER_TEMP/img/worker.tar"
      - name: THIRD-PARTY-LICENSES
        env:
          CONTAINER_RUNTIME: podman
        run: |
          set -euo pipefail
          . scripts/tool-versions.env
          pg=$(grep -oE 'docker\.io/library/postgres:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' compose.yaml | head -n1)
          podman pull -q "$pg" >/dev/null
          scripts/gen-licenses.sh dist/THIRD-PARTY-LICENSES "$FLAVOR" \
            "api=localhost/convertflow-api:$VERSION" "worker=localhost/convertflow-worker:$VERSION-$FLAVOR" "postgres=$pg"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" -C dist -cf - THIRD-PARTY-LICENSES \
            | gzip -9n > dist/THIRD-PARTY-LICENSES.tar.gz
      - name: Air-gap bundle
        env:
          CONTAINER_RUNTIME: podman
          API_IMAGE: localhost/convertflow-api:${{ github.ref_name }}
          WORKER_IMAGE: localhost/convertflow-worker:${{ github.ref_name }}-lgpl
          LICENSES_DIR: dist/THIRD-PARTY-LICENSES
          SBOM_DIR: dist/sbom
        run: scripts/make-airgap-bundle.sh "$VERSION" "$FLAVOR" dist
      - name: Checksums and signatures (cosign keyless sign-blob)
        run: |
          set -euo pipefail
          cp dist/sbom/*.cdx.json dist/
          rm -rf dist/sbom dist/THIRD-PARTY-LICENSES
          cp "$RUNNER_TEMP/image-refs.txt" dist/IMAGE-REFS.txt
          ( cd dist && sha256sum -- * > SHA256SUMS )
          for f in dist/*; do
            case "$f" in */SHA256SUMS|*/convertflow-*-airgap.tar.gz|*.cdx.json) cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" ;; esac
          done
          ls -l dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Verify

          Images and files are signed keyless with cosign (GitHub OIDC). Identity for this release:
          \`https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION}\`, issuer \`https://token.actions.githubusercontent.com\`.

              cosign verify <image-ref from IMAGE-REFS.txt> \\
                --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION}" \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com
              cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\
                --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION}" \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com
              sha256sum -c SHA256SUMS

          The air-gap bundle contains \`AIRGAP-README.txt\` with offline load instructions. Flavor: lgpl (FFmpeg LGPL build).
          NOTES
          pre=(); [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          gh release create "$VERSION" --repo "$REPO" --draft --verify-tag --title "ConvertFlow $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${pre[@]}" dist/*
